server:
  address: 127.0.0.1
  port: ${ASSISTANT_PORT:18081}

assistant:
  data-directory: ${ASSISTANT_DATA_DIR:./data}
  system-prompt: ${ASSISTANT_SYSTEM_PROMPT:classpath:prompts/assistant/v1.txt}
  shell-image: ${ASSISTANT_SHELL_IMAGE:ubuntu:24.04}
  control:
    heartbeat-interval-seconds: 5
    heartbeat-request-timeout-seconds: 3
    heartbeat-timeout-seconds: 30
  budget:
    window-tokens: 262144
    compact-ratio: 0.8
    keep-recent-ratio: 0.15
    max-output-tokens: 32768
    summary-output-tokens: 8192
    tool-result-threshold-tokens: 8192
    tool-result-preview-tokens: 4096
    max-model-calls: 100
    max-tools-per-round: 8
  model:
    provider: openai
    api-key: ${AI_API_KEY:}
    base-url: https://ws-34np4pi5koc2utbe.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    completions-path: /chat/completions
    name: qwen4-max
    reasoning-effort: ""
    timeout-seconds: 600
    context-window-tokens: 1048576
    max-output-tokens: 1048576
    output-token-parameter: max-tokens
