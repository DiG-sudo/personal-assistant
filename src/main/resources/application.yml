server:
  address: 127.0.0.1
  port: ${ASSISTANT_PORT:18081}

assistant:
  data-directory: ${ASSISTANT_DATA_DIR:./data}
  system-prompt: ${ASSISTANT_SYSTEM_PROMPT:classpath:prompts/assistant/v1.txt}
  shell-image: ${ASSISTANT_SHELL_IMAGE:ubuntu:24.04}
  limits:
    max-model-calls: 12
    max-context-chars: 64000
    max-tools-per-round: 8
  model:
    provider: openai
    api-key: ${AI_API_KEY:}
    base-url: https://ws-34np4pi5koc2utbe.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    completions-path: /chat/completions
    name: kimi-k3
    reasoning-effort: ""
    timeout-seconds: 600
